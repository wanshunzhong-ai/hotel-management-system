<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('预订登记')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('reservations')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar('预订登记', '选择客户与日期，系统自动筛出可预订房间')}"></header>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="row">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-header">
                            <h2>
                                <i class="bi bi-calendar-plus me-2 text-primary"></i>
                                <span th:text="${form.id == null} ? '新建预订' : '修改预订'">新建预订</span>
                            </h2>
                            <a th:href="@{/reservations}" class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i>返回列表
                            </a>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/reservations/save}" th:object="${form}" method="post" id="reservationForm">
                                <input type="hidden" th:field="*{id}">
                                <input type="hidden" id="currentRoomId" th:value="${form.roomId}">

                                <div class="row g-3">
                                    <div class="col-md-12">
                                        <label class="form-label required" for="customerSearch">客户</label>
                                        <div class="d-flex gap-2 align-items-start">
                                            <div class="picker flex-grow-1" id="customerPicker"
                                                 th:classappend="${selectedCustomer != null} ? 'is-selected'">
                                                <div class="picker-input-wrap">
                                                    <input type="text" class="form-control picker-input"
                                                           id="customerSearch" autocomplete="off"
                                                           placeholder="输入姓名或手机号搜索客户"
                                                           th:value="${selectedCustomer != null} ? ${selectedCustomer.display()} : ''">
                                                    <button type="button" class="picker-clear" id="customerClear"
                                                            title="清除已选客户" tabindex="-1">&times;</button>
                                                </div>
                                                <div class="picker-list" id="customerList"></div>
                                            </div>
                                            <input type="hidden" id="customerId" th:field="*{customerId}">
                                            <button type="button" class="btn btn-outline-secondary"
                                                    data-bs-toggle="modal" data-bs-target="#customerModal"
                                                    title="新建客户档案">
                                                <i class="bi bi-person-plus"></i>
                                            </button>
                                        </div>
                                        <div class="text-muted-sm mt-1" style="font-size:12px">
                                            输入手机号前几位即可定位到客人，不用翻找下拉列表；列表里没有的客人可直接建档并自动选中。
                                        </div>
                                        <div class="text-danger mt-1" style="font-size:12px"
                                             th:if="${#fields.hasErrors('customerId')}" th:errors="*{customerId}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label required" for="checkInDate">入住日期</label>
                                        <input type="date" class="form-control" id="checkInDate" th:field="*{checkInDate}"
                                               th:attr="min=${today},max=${latestCheckIn}">
                                        <div class="text-muted-sm mt-1" style="font-size:12px"
                                             th:text="'最晚可订至 ' + ${#temporals.format(latestCheckIn,'yyyy-MM-dd')}">—</div>
                                        <div class="text-danger mt-1" style="font-size:12px"
                                             th:if="${#fields.hasErrors('checkInDate')}" th:errors="*{checkInDate}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label required" for="checkOutDate">离店日期</label>
                                        <input type="date" class="form-control" id="checkOutDate" th:field="*{checkOutDate}"
                                               th:attr="min=${today}">
                                        <div class="text-muted-sm mt-1" style="font-size:12px"
                                             th:text="'单次最多 ' + ${maxStayNights} + ' 晚'">—</div>
                                        <div class="text-danger mt-1" style="font-size:12px"
                                             th:if="${#fields.hasErrors('checkOutDate')}" th:errors="*{checkOutDate}"></div>
                                    </div>

                                    <div class="col-md-8">
                                        <label class="form-label required" for="roomId">房间</label>
                                        <select class="form-select" id="roomId" th:field="*{roomId}">
                                            <option value="">请先选择入住与离店日期</option>
                                        </select>
                                        <div class="text-muted-sm mt-1" id="roomHint">
                                            <i class="bi bi-info-circle me-1"></i>系统会自动排除该时间段已被预订或维修中的房间
                                        </div>
                                        <div class="text-danger mt-1" style="font-size:12px"
                                             th:if="${#fields.hasErrors('roomId')}" th:errors="*{roomId}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label required" for="guestCount">入住人数</label>
                                        <input type="number" class="form-control" id="guestCount" th:field="*{guestCount}" min="1">
                                        <div class="text-danger mt-1" style="font-size:12px"
                                             th:if="${#fields.hasErrors('guestCount')}" th:errors="*{guestCount}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label" for="ratePlanId">房价方案</label>
                                        <select class="form-select" id="ratePlanId" th:field="*{ratePlanId}"
                                                onchange="updateSummary()">
                                            <option value="">门市价（不优惠）</option>
                                            <option th:each="p : ${ratePlans}" th:value="${p.id}"
                                                    th:text="${p.name} + ' · ' + ${p.discountLabel}"
                                                    th:attr="data-fixed=${p.fixedPrice},data-rate=${p.discountRate}"></option>
                                        </select>
                                        <div class="text-muted-sm mt-1" style="font-size:12px">
                                            协议价 / 会员价；选定客户为会员时会自动带出其等级的会员价
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label" for="remark">备注</label>
                                        <textarea class="form-control" id="remark" th:field="*{remark}" rows="2"
                                                  placeholder="到店时间、特殊要求等"></textarea>
                                    </div>
                                </div>

                                <div class="alert alert-info mt-3" id="summaryBox" style="display:none">
                                    <i class="bi bi-calculator"></i>
                                    <span id="summaryText"></span>
                                </div>

                                <div class="divider"></div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg me-1"></i>保存订单
                                </button>
                                <a th:href="@{/reservations}" class="btn btn-outline-secondary ms-2">取消</a>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card mb-3">
                        <div class="card-header"><h2><i class="bi bi-info-circle me-2 text-primary"></i>预订规则</h2></div>
                        <div class="card-body text-muted-sm" style="line-height:2">
                            <p class="mb-2">离店日期必须晚于入住日期，单次最多可住 <b th:text="${maxStayNights}">30</b> 晚。</p>
                            <p class="mb-2">入住日期不能早于今天，最多可提前 <b th:text="${maxAdvanceDays}">365</b> 天预订。</p>
                            <p class="mb-2">系统按「<b>区间重叠</b>」判定占用，同一房间不会重复卖出。</p>
                            <p class="mb-2">下单时按房型当前门市价<b>锁定房价</b>，后续调价不影响该订单。</p>
                            <p class="mb-0">客人到店后，在订单上点击「入住」即可完成登记。</p>
                        </div>
                    </div>
                    <div class="card" th:if="${reservation != null}">
                        <div class="card-header"><h2><i class="bi bi-clock-history me-2 text-primary"></i>当前订单</h2></div>
                        <div class="card-body text-muted-sm">
                            <div class="d-flex justify-content-between mb-2">
                                <span>订单号</span><b class="mono" th:text="${reservation.orderNo}">—</b>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>状态</span>
                                <span class="badge-soft" th:classappend="${reservation.status.color}"
                                      th:text="${reservation.status.label}">—</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span>原房费</span>
                                <b class="money" th:text="'￥' + ${#numbers.formatDecimal(reservation.roomAmount, 1, 'COMMA', 2, 'POINT')}">—</b>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 内联新建客户：不跳转页面，保存后自动选中，避免已填的预订信息丢失 -->
            <div class="modal fade" id="customerModal" tabindex="-1" aria-labelledby="customerModalTitle"
                 aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <!-- data-no-lock：提交按钮由下面的 fetch 流程自行管理，跳过全局防重复点击 -->
                        <form id="customerQuickForm" th:action="@{/customers/quick}" method="post" data-no-lock>
                            <div class="modal-header">
                                <h5 class="modal-title" id="customerModalTitle">
                                    <i class="bi bi-person-plus me-2 text-primary"></i>新建客户档案
                                </h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                        aria-label="关闭"></button>
                            </div>
                            <div class="modal-body">
                                <div class="alert alert-danger py-2 d-none" id="customerQuickAlert"></div>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label required" for="qName">姓名</label>
                                        <input type="text" class="form-control" id="qName" name="name" maxlength="50">
                                        <div class="quick-form-error" data-error-for="name"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label required" for="qPhone">手机号</label>
                                        <input type="text" class="form-control" id="qPhone" name="phone"
                                               maxlength="20" placeholder="11 位手机号">
                                        <div class="quick-form-error" data-error-for="phone"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label required" for="qGender">性别</label>
                                        <select class="form-select" id="qGender" name="gender">
                                            <option th:each="g : ${genders}" th:value="${g}" th:text="${g.label}"
                                                    th:selected="${g.name() == 'MALE'}"></option>
                                        </select>
                                        <div class="quick-form-error" data-error-for="gender"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label required" for="qIdType">证件类型</label>
                                        <select class="form-select" id="qIdType" name="idType">
                                            <option th:each="t : ${idTypes}" th:value="${t}" th:text="${t.label}"></option>
                                        </select>
                                        <div class="quick-form-error" data-error-for="idType"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label" for="qMemberLevel">会员等级</label>
                                        <select class="form-select" id="qMemberLevel" name="memberLevel">
                                            <option th:each="m : ${memberLevels}" th:value="${m}" th:text="${m}"></option>
                                        </select>
                                        <div class="quick-form-error" data-error-for="memberLevel"></div>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label required" for="qIdNo">证件号码</label>
                                        <input type="text" class="form-control" id="qIdNo" name="idNo" maxlength="40"
                                               placeholder="18 位身份证号 / 护照号">
                                        <div class="quick-form-error" data-error-for="idNo"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                                    取消
                                </button>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg me-1"></i>保存并选中
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>

<script th:inline="javascript">
    // 会员等级 → 会员价方案 id，选定客户后自动带出对应会员价
    window.__memberPlanIds = /*[[${memberPlanIds}]]*/ {};
</script>

<script>
    (function () {
        const checkIn = document.getElementById('checkInDate');
        const checkOut = document.getElementById('checkOutDate');
        const roomSelect = document.getElementById('roomId');
        const hint = document.getElementById('roomHint');
        const guestCount = document.getElementById('guestCount');
        const summaryBox = document.getElementById('summaryBox');
        const summaryText = document.getElementById('summaryText');
        const preservedRoomId = document.getElementById('currentRoomId').value;

        let roomCache = [];

        function nights() {
            if (!checkIn.value || !checkOut.value) return 0;
            const a = new Date(checkIn.value), b = new Date(checkOut.value);
            return Math.round((b - a) / 86400000);
        }

        /** 离店日期下限跟随入住日期（至少次日），避免提交"同日入住离店" */
        function syncCheckOutMin() {
            if (!checkIn.value) return;
            const next = new Date(checkIn.value);
            next.setDate(next.getDate() + 1);
            const iso = next.toISOString().slice(0, 10);
            checkOut.min = iso;
            if (checkOut.value && checkOut.value < iso) {
                checkOut.value = iso;
            }
        }

        function renderRooms(rooms) {
            roomCache = rooms;
            const prev = roomSelect.value || preservedRoomId;
            roomSelect.innerHTML = '<option value="">请选择房间</option>';
            if (!rooms.length) {
                const o = document.createElement('option');
                o.disabled = true;
                o.textContent = '该时段没有可预订的房间';
                roomSelect.appendChild(o);
                hint.innerHTML = '<i class="bi bi-exclamation-circle me-1 text-danger"></i>该时段所有房间均已被占用，请调整日期。';
                updateSummary();
                return;
            }
            rooms.forEach((r) => {
                const o = document.createElement('option');
                o.value = r.id;
                o.textContent = r.roomNo + ' · ' + r.typeName + ' · ' + r.bedType + ' · ￥' + r.price + '/晚 · 限' + r.capacity + '人';
                roomSelect.appendChild(o);
            });
            // 编辑态保留原房间
            if (prev && !rooms.some((r) => String(r.id) === String(prev))) {
                const o = document.createElement('option');
                o.value = prev;
                o.textContent = '（当前房间）保持不变';
                roomSelect.appendChild(o);
            }
            if (prev) roomSelect.value = prev;
            hint.innerHTML = '<i class="bi bi-check-circle me-1 text-success"></i>共筛出 ' + rooms.length + ' 间可预订房间。';
            updateSummary();
        }

        /** 按所选房价方案折算单价：固定房价优先，其次折扣率，否则门市价 */
        function effectiveUnit(listPrice) {
            const planSel = document.getElementById('ratePlanId');
            const opt = planSel && planSel.selectedOptions && planSel.selectedOptions[0];
            if (!opt) return Number(listPrice);
            const fixed = Number(opt.getAttribute('data-fixed') || 0);
            const rate = Number(opt.getAttribute('data-rate') || 0);
            if (fixed > 0) return Math.round(fixed * 100) / 100;
            if (rate > 0) return Math.round(Number(listPrice) * rate * 100) / 100;
            return Number(listPrice);
        }

        function updateSummary() {
            const n = nights();
            const r = roomCache.find((x) => String(x.id) === String(roomSelect.value));
            if (n > 0 && r) {
                const unit = effectiveUnit(r.price);
                const total = (n * unit).toFixed(2);
                const planNote = unit < Number(r.price)
                    ? ' <span class="badge-soft success">方案价</span> 门市价 ￥' + r.price + ' → ￥' + unit.toFixed(2) + '/晚'
                    : '';
                summaryText.innerHTML = '共 <b>' + n + '</b> 晚 × ￥' + unit.toFixed(2) + '/晚 ＝ 房费合计 <b>￥' + total + '</b>' + planNote;
                summaryBox.style.display = '';
            } else {
                summaryBox.style.display = 'none';
            }
            if (guestCount && r && Number(guestCount.value) > r.capacity) {
                guestCount.classList.add('is-invalid');
            } else if (guestCount) {
                guestCount.classList.remove('is-invalid');
            }
        }

        function loadRooms() {
            if (!checkIn.value || !checkOut.value) return;
            if (nights() <= 0) {
                roomSelect.innerHTML = '<option value="">离店日期需晚于入住日期</option>';
                return;
            }
            fetch('/reservations/available-rooms?checkIn=' + checkIn.value + '&checkOut=' + checkOut.value)
                .then((res) => res.json())
                .then(renderRooms)
                .catch(() => {
                    hint.innerHTML = '<i class="bi bi-exclamation-triangle me-1 text-danger"></i>房间列表加载失败，请刷新页面重试。';
                });
        }

        checkIn.addEventListener('change', function () {
            syncCheckOutMin();
            loadRooms();
        });
        checkOut.addEventListener('change', loadRooms);
        roomSelect.addEventListener('change', updateSummary);
        if (guestCount) guestCount.addEventListener('input', updateSummary);
        syncCheckOutMin();
        loadRooms();

        // ------------------------------------------------ 客户选择器
        const picker = window.initCustomerPicker({
            rootId: 'customerPicker',
            inputId: 'customerSearch',
            hiddenId: 'customerId',
            listId: 'customerList',
            clearId: 'customerClear',
            // 选了会员客户就自动带出对应等级的会员价方案，前台不用记谁打几折
            onSelect: function (c) {
                const planSel = document.getElementById('ratePlanId');
                if (!planSel || !c || !c.memberLevel) return;
                const ids = window.__memberPlanIds || {};
                const planId = ids[c.memberLevel];
                if (planId) {
                    planSel.value = String(planId);
                    updateSummary();
                }
            }
        });

        // -------------------------------------- 内联新建客户（不离开本页）
        const quickForm = document.getElementById('customerQuickForm');
        if (quickForm) {
            const modalEl = document.getElementById('customerModal');
            const alertBox = document.getElementById('customerQuickAlert');
            const submitBtn = quickForm.querySelector('button[type="submit"]');
            let modalInstance = null;

            function clearQuickErrors() {
                alertBox.classList.add('d-none');
                alertBox.textContent = '';
                quickForm.querySelectorAll('.quick-form-error').forEach(function (el) {
                    el.textContent = '';
                });
            }

            function showQuickErrors(errors, message) {
                clearQuickErrors();
                Object.keys(errors || {}).forEach(function (field) {
                    const target = quickForm.querySelector('[data-error-for="' + field + '"]');
                    if (target) {
                        target.textContent = errors[field];
                    }
                });
                if (message) {
                    alertBox.textContent = message;
                    alertBox.classList.remove('d-none');
                }
            }

            modalEl.addEventListener('shown.bs.modal', function () {
                clearQuickErrors();
                const first = document.getElementById('qName');
                if (first) first.focus();
            });

            quickForm.addEventListener('submit', function (e) {
                e.preventDefault();
                clearQuickErrors();
                submitBtn.disabled = true;
                fetch(quickForm.action, {
                    method: 'POST',
                    body: new FormData(quickForm),
                    headers: { 'Accept': 'application/json' }
                })
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        if (data && data.ok && data.customer) {
                            // 建档成功：直接选中新客户，预订表单里的日期/房间/人数全部保留
                            if (picker) picker.select(data.customer);
                            quickForm.reset();
                            if (!modalInstance) {
                                modalInstance = bootstrap.Modal.getOrCreateInstance(modalEl);
                            }
                            modalInstance.hide();
                            return;
                        }
                        showQuickErrors(data && data.errors,
                            (data && data.message) || '保存失败，请检查后重试');
                    })
                    .catch(function () {
                        showQuickErrors({}, '网络异常，保存失败，请重试');
                    })
                    .finally(function () {
                        submitBtn.disabled = false;
                    });
            });
        }
    })();
</script>
</body>
</html>
