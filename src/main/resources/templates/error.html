<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>系统提示 · 酒店管理系统</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh">
    <div class="card" style="max-width:520px;width:100%">
        <div class="card-body text-center p-5">
            <div class="stat-icon bg-soft-danger mx-auto mb-3" style="width:62px;height:62px;font-size:27px">
                <i class="bi bi-cone-striped"></i>
            </div>
            <h1 style="font-size:21px;font-weight:700">操作未能完成</h1>
            <p class="text-muted-sm mt-3 mb-4" th:text="${message} ?: '系统遇到了一点问题，请稍后重试。'">
                错误信息
            </p>
            <div class="d-flex gap-2 justify-content-center">
                <a th:href="@{/dashboard}" class="btn btn-primary">
                    <i class="bi bi-house me-1"></i>返回首页
                </a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary">返回上一页</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
