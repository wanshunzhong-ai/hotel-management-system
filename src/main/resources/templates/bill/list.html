<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('账单结算')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('bills')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar('账单结算', '房费、消费与收款记录')}"></header>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="card mb-3">
                <div class="card-body py-3">
                    <form th:action="@{/bills}" method="get" class="filter-bar">
                        <div>
                            <label class="form-label">关键词</label>
                            <input type="text" class="form-control" name="keyword" th:value="${keyword}"
                                   placeholder="账单号 / 姓名 / 手机号 / 房号" style="width:230px">
                        </div>
                        <div>
                            <label class="form-label">账单状态</label>
                            <select class="form-select" name="status" style="width:140px">
                                <option value="">全部状态</option>
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"
                                        th:selected="${status != null && status == s}"></option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label">结账日期</label>
                            <div class="d-flex align-items-center gap-1">
                                <input type="date" class="form-control" name="settledFrom" style="width:150px"
                                       th:value="${settledFrom}">
                                <span class="text-muted-sm">~</span>
                                <input type="date" class="form-control" name="settledTo" style="width:150px"
                                       th:value="${settledTo}">
                            </div>
                        </div>
                        <div>
                            <label class="form-label">排序</label>
                            <select class="form-select" name="sort" style="width:170px">
                                <option th:each="e : ${sortLabels}" th:value="${e.key}" th:text="${e.value}"
                                        th:selected="${sort == e.key}"></option>
                            </select>
                        </div>
                        <input type="hidden" name="size" th:value="${page.size}">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-search me-1"></i>查询</button>
                        <a th:href="@{/bills}" class="btn btn-outline-secondary">重置</a>
                        <a th:href="@{/bills/export(keyword=${keyword}, status=${status},
                                                    settledFrom=${settledFrom}, settledTo=${settledTo}, sort=${sort})}"
                           class="btn btn-outline-secondary">
                            <i class="bi bi-download me-1"></i>导出 CSV
                        </a>
                        <a th:href="@{/bills(status='UNPAID')}" class="btn btn-accent ms-auto">
                            <i class="bi bi-exclamation-circle me-1"></i>只看待结账
                        </a>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>
                        <i class="bi bi-receipt me-2 text-primary"></i>账单列表
                    </h2>
                </div>
                <div class="table-wrap">
                    <table class="table table-sticky-first">
                        <thead>
                        <tr>
                            <th style="width:140px">账单号</th>
                            <th>客户</th>
                            <th style="width:110px">房间</th>
                            <th class="text-end" style="width:110px">房费</th>
                            <th class="text-end" style="width:110px">其他消费</th>
                            <th class="text-end" style="width:110px">应收合计</th>
                            <th class="text-end" style="width:110px">实收</th>
                            <th style="width:110px">状态</th>
                            <th style="width:110px" class="text-end">操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="b : ${page.content}">
                            <td>
                                <a th:href="@{/bills/{id}(id=${b.id})}" class="mono" th:text="${b.billNo}">BL202610100001</a>
                                <div class="text-muted-sm"
                                     th:text="${b.settledAt == null ? '待结账' : #temporals.format(b.settledAt,'MM-dd HH:mm')}">—</div>
                            </td>
                            <td>
                                <strong th:text="${b.customer.name}">张伟</strong>
                                <div class="text-muted-sm mono" th:text="${b.customer.phone}">—</div>
                            </td>
                            <td class="mono" th:text="${b.room.roomNo}">201</td>
                            <td class="text-end money"
                                th:text="'￥' + ${#numbers.formatDecimal(b.roomAmount, 1, 'COMMA', 2, 'POINT')}">￥0</td>
                            <td class="text-end money"
                                th:text="'￥' + ${#numbers.formatDecimal(b.otherAmount, 1, 'COMMA', 2, 'POINT')}">￥0</td>
                            <td class="text-end money fw-bold"
                                th:text="'￥' + ${#numbers.formatDecimal(b.totalAmount, 1, 'COMMA', 2, 'POINT')}">￥0</td>
                            <td class="text-end money text-success"
                                th:text="'￥' + ${#numbers.formatDecimal(b.paidAmount, 1, 'COMMA', 2, 'POINT')}">￥0</td>
                            <td>
                                <span class="badge-soft" th:classappend="${b.status.color}"
                                      th:text="${b.status.label}">待结账</span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/bills/{id}(id=${b.id})}"
                                   class="btn btn-sm btn-outline-secondary text-nowrap">
                                    <i class="bi bi-eye"></i> 明细
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${page.totalElements == 0}">
                            <td colspan="9">
                                <div class="empty-state"><i class="bi bi-receipt"></i>没有符合条件的账单，退房后会自动生成</div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div th:replace="~{fragments/pagination :: pager(${page}, ${pageNumbers}, ${pageBase}, ${sizeBase}, ${sizes})}"></div>
            </div>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
