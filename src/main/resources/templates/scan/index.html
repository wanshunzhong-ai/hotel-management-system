<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title th:text="'客房消费 · ' + ${hotelName}">客房消费</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons.min.css}">
    <style>
        body { background: #f4f6fb; color: #1f2937; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
        .scan-wrap { max-width: 520px; margin: 0 auto; padding: 16px 14px 40px; }
        .scan-head {
            background: linear-gradient(160deg, #0b1220 0%, #1b2942 100%);
            color: #e2e8f0; border-radius: 16px; padding: 18px 18px 16px; margin-bottom: 14px;
        }
        .scan-head .room { font-size: 30px; font-weight: 500; letter-spacing: .5px; color: #fff; }
        .scan-head .sub { font-size: 12px; color: #94a3b8; margin-top: 2px; }
        .scan-card { background: #fff; border: 1px solid #e6eaf2; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
        .item-row { display: flex; align-items: center; gap: 12px; }
        .item-name { font-size: 15px; font-weight: 500; }
        .item-meta { font-size: 12px; color: #6b7280; margin-top: 2px; }
        .item-price { font-size: 17px; color: #b91c1c; font-weight: 500; white-space: nowrap; }
        .qty { width: 62px; }
        .btn-order { min-width: 84px; }
        .scan-foot { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 18px; }
        .cate-tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #eef2ff; color: #4338ca; margin-left: 6px; }
    </style>
</head>
<body>
<div class="scan-wrap">

    <!-- 无效二维码 -->
    <div th:if="${invalidToken}" class="scan-card text-center py-4">
        <i class="bi bi-x-octagon" style="font-size:40px;color:#dc2626"></i>
        <div class="mt-2" style="font-size:16px;font-weight:500">二维码无效或已失效</div>
        <div class="text-muted mt-1" style="font-size:13px">请重新扫描房间内的二维码，或联系前台协助。</div>
    </div>

    <th:block th:unless="${invalidToken}">
        <div class="scan-head">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <div class="room" th:text="${room.roomNo}">8801</div>
                    <div class="sub" th:text="${room.roomType.name}">标准大床房</div>
                </div>
                <div class="text-end">
                    <div class="sub">住客自助消费</div>
                    <div class="sub" th:text="${#temporals.format(today,'yyyy-MM-dd')}">2026-10-11</div>
                </div>
            </div>
            <div class="mt-3 pt-3" style="border-top:1px solid rgba(148,163,184,.28);font-size:13px"
                 th:if="${inHouse}">
                <i class="bi bi-person-check me-1"></i>
                <span th:text="${guestName}">张伟</span>
                <span class="ms-2 text-secondary" th:text="'订单 ' + ${orderNo}">订单</span>
            </div>
            <div class="mt-3 pt-3" style="border-top:1px solid rgba(148,163,184,.28);font-size:13px"
                 th:unless="${inHouse}">
                <i class="bi bi-info-circle me-1"></i>本房间当前没有在住客人
            </div>
        </div>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <div th:if="${ok}" class="scan-card text-center py-3" style="border-color:#bbf7d0;background:#f0fdf4">
            <i class="bi bi-check-circle-fill" style="font-size:30px;color:#16a34a"></i>
            <div class="mt-2" style="font-size:15px;font-weight:500">下单成功</div>
            <div class="text-muted" style="font-size:13px">费用将在退房时一并结算，可在前台核对。</div>
        </div>

        <div th:if="${inHouse}">
            <div class="scan-card" th:each="i : ${items}">
                <form th:action="@{'/scan/' + ${token}}" method="post" class="item-row">
                    <input type="hidden" name="itemId" th:value="${i.id}">
                    <div class="flex-grow-1">
                        <div class="item-name">
                            <span th:text="${i.itemName}">矿泉水</span>
                            <span class="cate-tag" th:text="${i.category.label}">迷你吧</span>
                        </div>
                        <div class="item-meta" th:text="${i.note} ?: '客房消费项目'">—</div>
                    </div>
                    <div class="item-price" th:text="'￥' + ${#numbers.formatDecimal(i.unitPrice,1,'COMMA',2,'POINT')}">￥8.00</div>
                    <input type="number" class="form-control form-control-sm qty" name="quantity"
                           min="1" max="99" value="1">
                    <button type="submit" class="btn btn-primary btn-sm btn-order">下单</button>
                </form>
            </div>

            <div class="scan-card text-center text-muted py-3" th:if="${items.isEmpty()}" style="font-size:13px">
                暂无可选购商品，请联系前台
            </div>
        </div>

        <div th:unless="${inHouse}" class="scan-card text-center py-4">
            <i class="bi bi-door-closed" style="font-size:34px;color:#94a3b8"></i>
            <div class="mt-2" style="font-size:14px">如需消费，请先到前台办理入住</div>
        </div>
    </th:block>

    <div class="scan-foot">
        <span th:text="${hotelName}">云栖大酒店</span> · 客房自助消费
    </div>
</div>
<script th:src="@{/vendor/bootstrap.bundle.min.js}"></script>
</body>
</html>
