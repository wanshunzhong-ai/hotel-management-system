<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('交接班对账')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('shift')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar('交接班对账', '本班收款汇总与交班留痕')}"></header>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="alert alert-info py-2 mb-3" style="font-size:13px">
                <i class="bi bi-info-circle me-1"></i>
                统计区间：<b th:text="${summary.fromLabel}">上一班</b>
                ~ <span class="mono" th:text="${#temporals.format(summary.toTime,'yyyy-MM-dd HH:mm')}">—</span>。
                每一笔收款都来自收款流水的真实记录，交班即固化快照、双方签字后不可篡改。
            </div>

            <div class="stat-grid mb-3">
                <div class="stat-card">
                    <div class="stat-icon bg-soft-primary"><i class="bi bi-cash-stack"></i></div>
                    <div>
                        <div class="stat-label">当班净收款</div>
                        <div class="stat-value"
                             th:text="'￥' + ${#numbers.formatDecimal(summary.totalReceived, 1, 'COMMA', 2, 'POINT')}">￥0</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon bg-soft-success"><i class="bi bi-shield-plus"></i></div>
                    <div>
                        <div class="stat-label">押金 + 预订金</div>
                        <div class="stat-value"
                             th:text="'￥' + ${#numbers.formatDecimal(summary.depositIn, 1, 'COMMA', 2, 'POINT')}">￥0</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon bg-soft-danger"><i class="bi bi-arrow-return-left"></i></div>
                    <div>
                        <div class="stat-label">退款 / 找零</div>
                        <div class="stat-value"
                             th:text="'￥' + ${#numbers.formatDecimal(summary.refund, 1, 'COMMA', 2, 'POINT')}">￥0</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon bg-soft-info"><i class="bi bi-receipt"></i></div>
                    <div>
                        <div class="stat-label">流水笔数</div>
                        <div class="stat-value" th:text="${summary.recordCount}">0</div>
                    </div>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-lg-7">
                    <div class="card mb-3">
                        <div class="card-header">
                            <h2><i class="bi bi-wallet2 me-2 text-primary"></i>按支付方式（净额）</h2>
                            <span class="text-muted-sm">
                                办理入住 <b th:text="${summary.checkInCount}">0</b> ·
                                退房 <b th:text="${summary.checkOutCount}">0</b> ·
                                涉及订单 <b th:text="${summary.orderCount}">0</b>
                            </span>
                        </div>
                        <div class="table-wrap">
                            <table class="table">
                                <thead>
                                <tr>
                                    <th>支付方式</th>
                                    <th class="text-end">净收款</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="e : ${summary.byMethod}">
                                    <td th:text="${e.key}">现金</td>
                                    <td class="text-end money fw-bold"
                                        th:classappend="${e.value.signum() >= 0} ? 'text-success' : 'text-danger'"
                                        th:text="'￥' + ${#numbers.formatDecimal(e.value, 1, 'COMMA', 2, 'POINT')}">￥0</td>
                                </tr>
                                <tr th:if="${#maps.isEmpty(summary.byMethod)}">
                                    <td colspan="2" class="text-center text-muted-sm py-3">本班暂无资金往来</td>
                                </tr>
                                </tbody>
                                <tfoot th:if="${!#maps.isEmpty(summary.byMethod)}">
                                <tr style="background:#eef4ff">
                                    <td class="text-end"><b>净收款合计</b></td>
                                    <td class="text-end money fw-bold"
                                        th:text="'￥' + ${#numbers.formatDecimal(summary.totalReceived, 1, 'COMMA', 2, 'POINT')}">￥0</td>
                                </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h2><i class="bi bi-list-ul me-2 text-primary"></i>本班流水明细</h2>
                        </div>
                        <div class="table-wrap" style="max-height:420px;overflow:auto">
                            <table class="table table-sticky-first">
                                <thead>
                                <tr>
                                    <th style="width:130px">时间</th>
                                    <th style="width:110px">类型</th>
                                    <th>订单 / 客户</th>
                                    <th style="width:80px">房间</th>
                                    <th style="width:100px">方式</th>
                                    <th class="text-end" style="width:110px">金额</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="p : ${summary.records}">
                                    <td class="mono text-muted-sm"
                                        th:text="${#temporals.format(p.occurredAt,'HH:mm')}">—</td>
                                    <td>
                                        <span class="badge-soft" th:classappend="${p.type.income} ? 'success' : 'danger'"
                                              th:text="${p.type.label}">收取押金</span>
                                    </td>
                                    <td>
                                        <span class="mono" th:text="${p.reservation.orderNo}">—</span>
                                        <span class="text-muted-sm ms-1" th:text="${p.reservation.customer.name}">—</span>
                                    </td>
                                    <td class="mono" th:text="${p.reservation.room.roomNo}">—</td>
                                    <td th:text="${p.payMethod == null ? '—' : p.payMethod.label}">—</td>
                                    <td class="text-end money"
                                        th:classappend="${p.type.income} ? 'text-success' : 'text-danger'"
                                        th:text="${(p.type.income ? '+' : '-') + '￥' + #numbers.formatDecimal(p.amount, 1, 'COMMA', 2, 'POINT')}">￥0</td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(summary.records)}">
                                    <td colspan="6" class="text-center text-muted-sm py-3">本班暂无流水</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="col-lg-5">
                    <div class="card mb-3">
                        <div class="card-header"><h2><i class="bi bi-arrow-left-right me-2 text-primary"></i>确认交班</h2></div>
                        <div class="card-body">
                            <div th:if="${summary.empty}" class="alert alert-info py-2 mb-3" style="font-size:13px">
                                本班没有任何资金往来，无需交班。
                            </div>
                            <form th:action="@{/shift/handover}" method="post" th:if="${!summary.empty}">
                                <div class="mb-3">
                                    <label class="form-label" for="receivedBy">接班人</label>
                                    <input type="text" class="form-control" id="receivedBy" name="receivedBy"
                                           maxlength="50" placeholder="留空则记为本人">
                                </div>
                                <div class="mb-3 form-check">
                                    <input class="form-check-input" type="checkbox" id="cashVerified"
                                           name="cashVerified" value="true">
                                    <label class="form-check-label" for="cashVerified">
                                        现金已当面点清并交接
                                    </label>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="remark">交班备注</label>
                                    <textarea class="form-control" id="remark" name="remark" rows="2"
                                              maxlength="200" placeholder="如：备用金 1000 元整，收款与账面一致"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary w-100"
                                        data-confirm="确认交班？交班后本班快照将固化留存，不可修改。">
                                    <i class="bi bi-check2-circle me-1"></i>确认交班并固化为快照
                                </button>
                            </form>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header"><h2><i class="bi bi-clock-history me-2 text-primary"></i>历史交班记录</h2></div>
                        <div class="table-wrap">
                            <table class="table">
                                <thead>
                                <tr>
                                    <th>交班单号</th>
                                    <th style="width:90px">净收款</th>
                                    <th style="width:100px">交 / 接</th>
                                    <th style="width:60px"></th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="h : ${history}">
                                    <td>
                                        <div class="mono" th:text="${h.shiftNo}">SH—</div>
                                        <div class="text-muted-sm" th:text="${h.shiftDate}">—</div>
                                    </td>
                                    <td class="money"
                                        th:text="'￥' + ${#numbers.formatDecimal(h.totalReceived, 1, 'COMMA', 2, 'POINT')}">￥0</td>
                                    <td class="text-muted-sm">
                                        <div th:text="${h.operator} ?: '—'">—</div>
                                        <div th:text="'→ ' + (${h.receivedBy} ?: '—')">→ —</div>
                                    </td>
                                    <td>
                                        <a th:href="@{/shift/{id}/print(id=${h.id})}"
                                           class="btn btn-sm btn-outline-secondary" title="打印交班单">
                                            <i class="bi bi-printer"></i>
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(history)}">
                                    <td colspan="4" class="text-center text-muted-sm py-3">还没有交班记录</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
