<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · ' + ${hotelName} + '管理系统'">酒店管理系统</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏨</text></svg>">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- ============================ 侧边栏 ============================ -->
<aside th:fragment="sidebar(active)" class="app-sidebar">
    <div class="sidebar-brand">
        <div class="logo">云</div>
        <div class="brand-text">
            <div class="brand-name" th:text="${hotelName}">云栖大酒店</div>
            <div class="brand-sub">HOTEL PMS</div>
        </div>
    </div>

    <nav class="sidebar-nav">
        <div class="nav-section">经营概览</div>
        <a th:href="@{/dashboard}" class="nav-link-item" th:classappend="${active == 'dashboard'} ? 'active'">
            <i class="bi bi-speedometer2"></i><span>数据看板</span>
        </a>
        <a th:href="@{/todos}" class="nav-link-item" th:classappend="${active == 'todos'} ? 'active'">
            <i class="bi bi-bell"></i><span>待办中心</span>
            <span class="nav-badge" th:if="${todoCount != null and todoCount > 0}" th:text="${todoCount}">0</span>
        </a>

        <div class="nav-section">前台业务</div>
        <a th:href="@{/reservations}" class="nav-link-item" th:classappend="${active == 'reservations'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','RECEPTION')">
            <i class="bi bi-journal-text"></i><span>预订管理</span>
        </a>
        <a th:href="@{/groups/checkin}" class="nav-link-item" th:classappend="${active == 'groups'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','RECEPTION')">
            <i class="bi bi-people-fill"></i><span>团队入住</span>
        </a>
        <a th:href="@{/bills}" class="nav-link-item" th:classappend="${active == 'bills'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','RECEPTION')">
            <i class="bi bi-receipt"></i><span>账单结算</span>
        </a>
        <a th:href="@{/payments}" class="nav-link-item" th:classappend="${active == 'payments'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','RECEPTION')">
            <i class="bi bi-cash-stack"></i><span>收款流水</span>
        </a>
        <a th:href="@{/invoices}" class="nav-link-item" th:classappend="${active == 'invoices'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','RECEPTION')">
            <i class="bi bi-receipt-cutoff"></i><span>发票管理</span>
        </a>
        <a th:href="@{/receivables}" class="nav-link-item" th:classappend="${active == 'receivables'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','RECEPTION')">
            <i class="bi bi-journal-check"></i><span>应收账款</span>
        </a>
        <a th:href="@{/shift}" class="nav-link-item" th:classappend="${active == 'shift'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','RECEPTION')">
            <i class="bi bi-arrow-left-right"></i><span>交接班对账</span>
        </a>
        <a th:href="@{/customers}" class="nav-link-item" th:classappend="${active == 'customers'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','RECEPTION')">
            <i class="bi bi-people"></i><span>客户档案</span>
        </a>

        <div class="nav-section">价格与政策</div>
        <a th:href="@{/rate-plans}" class="nav-link-item" th:classappend="${active == 'rate-plans'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','RECEPTION')">
            <i class="bi bi-tags"></i><span>房价方案</span>
        </a>

        <div class="nav-section">房态管理</div>
        <a th:href="@{/rooms/board}" class="nav-link-item" th:classappend="${active == 'room-board'} ? 'active'">
            <i class="bi bi-grid-3x3-gap"></i><span>房态一览</span>
        </a>
        <a th:href="@{/board}" class="nav-link-item" th:classappend="${active == 'bigboard'} ? 'active'">
            <i class="bi bi-display"></i><span>房态大屏</span>
        </a>
        <a th:href="@{/hk}" class="nav-link-item" th:classappend="${active == 'hk'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','RECEPTION','HOUSEKEEPING')">
            <i class="bi bi-phone"></i><span>现场上报</span>
        </a>

        <div class="nav-section">客房服务</div>
        <a th:href="@{/housekeeping/tasks}" class="nav-link-item"
           th:classappend="${active == 'housekeeping'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','RECEPTION','HOUSEKEEPING')">
            <i class="bi bi-brush"></i><span>派工与验收</span>
        </a>
        <a th:href="@{/housekeeping/schedule}" class="nav-link-item"
           th:classappend="${active == 'schedule'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','RECEPTION','HOUSEKEEPING_SUPERVISOR')">
            <i class="bi bi-calendar-week"></i><span>排班与工作量</span>
        </a>
        <a th:href="@{/checklists}" class="nav-link-item"
           th:classappend="${active == 'checklists'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','RECEPTION','HOUSEKEEPING')">
            <i class="bi bi-card-checklist"></i><span>清洁标准</span>
        </a>
        <a th:href="@{/inspections}" class="nav-link-item"
           th:classappend="${active == 'inspections'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','RECEPTION','HOUSEKEEPING')">
            <i class="bi bi-clipboard2-check"></i><span>查房评分</span>
        </a>
        <a th:href="@{/housekeeping/minibar}" class="nav-link-item"
           th:classappend="${active == 'minibar'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','RECEPTION','HOUSEKEEPING')">
            <i class="bi bi-cup-straw"></i><span>迷你吧挂账</span>
        </a>
        <a th:href="@{/supplies}" class="nav-link-item"
           th:classappend="${active == 'supplies'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','RECEPTION','HOUSEKEEPING')">
            <i class="bi bi-box-seam"></i><span>耗材出入库</span>
        </a>
        <a th:href="@{/laundry}" class="nav-link-item" th:classappend="${active == 'laundry'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','RECEPTION','HOUSEKEEPING')">
            <i class="bi bi-basket"></i><span>洗衣与布草</span>
        </a>
        <a th:href="@{/laundry/outsourcing}" class="nav-link-item"
           th:classappend="${active == 'outsourcing'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','RECEPTION','HOUSEKEEPING_SUPERVISOR')">
            <i class="bi bi-truck"></i><span>布草外送</span>
        </a>
        <a th:href="@{/consumables}" class="nav-link-item"
           th:classappend="${active == 'consumables'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','RECEPTION','HOUSEKEEPING')">
            <i class="bi bi-qr-code"></i><span>扫码消费</span>
        </a>
        <a th:href="@{/maintenance}" class="nav-link-item" th:classappend="${active == 'maintenance'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','RECEPTION','HOUSEKEEPING')">
            <i class="bi bi-tools"></i><span>维修工单</span>
        </a>
        <a th:href="@{/lost-found}" class="nav-link-item" th:classappend="${active == 'lostfound'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','RECEPTION','HOUSEKEEPING')">
            <i class="bi bi-search-heart"></i><span>失物招领</span>
        </a>

        <div class="nav-section">客房档案</div>
        <a th:href="@{/rooms}" class="nav-link-item" th:classappend="${active == 'rooms'} ? 'active'">
            <i class="bi bi-door-closed"></i><span>客房列表</span>
        </a>
        <a th:href="@{/room-types}" class="nav-link-item" th:classappend="${active == 'room-types'} ? 'active'"
           sec:authorize="hasAnyRole('ADMIN','RECEPTION')">
            <i class="bi bi-layers"></i><span>房型设置</span>
        </a>

        <div class="nav-section">系统</div>
        <a th:href="@{/logs}" class="nav-link-item" th:classappend="${active == 'logs'} ? 'active'"
           sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-clock-history"></i><span>操作日志</span>
        </a>
        <a th:href="@{/users}" class="nav-link-item" th:classappend="${active == 'users'} ? 'active'"
           sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-shield-lock"></i><span>账号权限</span>
        </a>
        <a th:href="@{/profile}" class="nav-link-item" th:classappend="${active == 'profile'} ? 'active'">
            <i class="bi bi-person-gear"></i><span>个人中心</span>
        </a>
    </nav>
</aside>

<!-- ============================ 顶栏 ============================ -->
<header th:fragment="topbar(title, subtitle)" class="app-topbar">
    <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm btn-light d-lg-none" id="sidebarToggle" type="button">
            <i class="bi bi-list"></i>
        </button>
        <div>
            <h1 class="page-title" th:text="${title}">页面标题</h1>
            <p class="page-subtitle" th:text="${subtitle}">页面说明</p>
        </div>
    </div>
    <div class="d-flex align-items-center gap-3">
        <div class="text-end d-none d-lg-block">
            <div class="text-muted-sm" th:text="${#temporals.format(today, 'yyyy年MM月dd日')}">今天</div>
        </div>
        <div class="dropdown">
            <div class="user-chip" data-bs-toggle="dropdown" role="button" aria-expanded="false">
                <div class="user-avatar" sec:authentication="principal.realName">员</div>
                <div class="user-meta">
                    <div class="name" sec:authentication="principal.realName">姓名</div>
                    <div class="role" sec:authentication="principal.role.label">角色</div>
                </div>
                <i class="bi bi-chevron-down text-muted" style="font-size:11px"></i>
            </div>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm" style="border-radius:11px;border-color:#e6eaf2">
                <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person me-2"></i>个人中心</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form th:action="@{/logout}" method="post" class="px-0">
                        <button type="submit" class="dropdown-item text-danger">
                            <i class="bi bi-box-arrow-right me-2"></i>退出登录
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</header>

<!-- ============================ 提示条 ============================ -->
<div th:fragment="flash" class="mb-3">
    <div class="alert alert-success" data-auto-dismiss th:if="${successMessage}">
        <i class="bi bi-check-circle-fill"></i><span th:text="${successMessage}">成功</span>
    </div>
    <div class="alert alert-danger" data-auto-dismiss th:if="${errorMessage}">
        <i class="bi bi-exclamation-triangle-fill"></i><span th:text="${errorMessage}">错误</span>
    </div>
</div>

<!-- ============================ 页脚 ============================ -->
<footer th:fragment="footer" class="app-footer">
    <span th:text="${hotelName} + ' · 酒店管理系统 v1.0'">云栖大酒店 · 酒店管理系统</span>
    <span class="float-end">Spring Boot 3 · Thymeleaf · MySQL</span>
</footer>

<!-- ============================ 脚本 ============================ -->
<th:block th:fragment="scripts">
    <script th:src="@{/vendor/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/chart.umd.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
