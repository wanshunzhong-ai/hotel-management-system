<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('失物招领')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar('lostfound')}"></aside>
    <div class="app-main">
        <header th:replace="~{fragments/layout :: topbar('失物招领', '客房拾遗登记 → 客人认领，全程留痕便于追溯')}"></header>
        <main class="app-content">
            <div th:replace="~{fragments/layout :: flash}"></div>

            <div class="card mb-3">
                <div class="card-header">
                    <h2>
                        <i class="bi bi-search-heart me-2 text-primary"></i>拾遗登记
                        <span class="text-muted-sm ms-2" th:text="'待认领 ' + ${openCount} + ' 件'">待认领 0 件</span>
                    </h2>
                </div>
                <div class="card-body">
                    <form th:action="@{/lost-found}" method="post">
                        <div class="row g-2 align-items-end">
                            <div class="col-6 col-lg-2">
                                <label class="form-label">物品名称</label>
                                <input type="text" class="form-control" name="itemName" required maxlength="100"
                                       placeholder="如：黑色雨伞">
                            </div>
                            <div class="col-6 col-lg-3">
                                <label class="form-label">物品描述</label>
                                <input type="text" class="form-control" name="description" maxlength="300"
                                       placeholder="颜色 / 品牌 / 内含物品">
                            </div>
                            <div class="col-6 col-lg-2">
                                <label class="form-label">拾获地点</label>
                                <input type="text" class="form-control" name="location" maxlength="100"
                                       placeholder="如：8806 房间">
                            </div>
                            <div class="col-6 col-lg-2">
                                <label class="form-label">拾获人</label>
                                <input type="text" class="form-control" name="finder" maxlength="50"
                                       placeholder="默认当前登录人">
                            </div>
                            <div class="col-12 col-lg-3">
                                <button type="submit" class="btn btn-primary w-100">
                                    <i class="bi bi-journal-plus me-1"></i>登记
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card mb-3">
                <div class="card-body py-3">
                    <form th:action="@{/lost-found}" method="get" class="filter-bar">
                        <div>
                            <label class="form-label">关键词</label>
                            <input type="text" class="form-control" name="keyword" th:value="${keyword}"
                                   placeholder="物品 / 地点 / 认领人" style="width:220px">
                        </div>
                        <div>
                            <label class="form-label">状态</label>
                            <select class="form-select" name="status" style="width:150px">
                                <option value="">全部状态</option>
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"
                                        th:selected="${status == s}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-search me-1"></i>查询</button>
                        <a th:href="@{/lost-found}" class="btn btn-outline-secondary">重置</a>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>
                        <i class="bi bi-box-seam me-2 text-primary"></i>失物台账
                        <span class="text-muted-sm ms-2" th:text="'共 ' + ${items.size()} + ' 条'">共 0 条</span>
                    </h2>
                </div>
                <div class="table-wrap">
                    <table class="table table-sticky-first">
                        <thead>
                        <tr>
                            <th>物品名称</th>
                            <th>描述</th>
                            <th style="width:140px">拾获地点</th>
                            <th style="width:110px">拾获人</th>
                            <th style="width:110px">状态</th>
                            <th style="width:200px">认领信息</th>
                            <th style="width:240px">操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="f : ${items}">
                            <td th:text="${f.itemName}">黑色雨伞</td>
                            <td class="text-muted-sm" th:text="${f.description} ?: '—'">—</td>
                            <td th:text="${f.location} ?: '—'">8806 房间</td>
                            <td th:text="${f.finder} ?: '—'">客房-王姐</td>
                            <td>
                                <span class="badge-soft" th:classappend="${f.status.color}"
                                      th:text="${f.status.label}">待认领</span>
                            </td>
                            <td class="text-muted-sm">
                                <div th:if="${f.claimant}" th:text="${f.claimant} + (${f.claimContact} == null ? '' : ' · ' + ${f.claimContact})">—</div>
                                <div th:if="${f.claimedAt}" th:text="${#temporals.format(f.claimedAt,'yyyy-MM-dd HH:mm')}">—</div>
                                <span th:unless="${f.claimant}">—</span>
                            </td>
                            <td>
                                <form th:if="${f.status.name() == 'OPEN'}"
                                      th:action="@{'/lost-found/' + ${f.id} + '/claim'}" method="post"
                                      class="d-flex gap-1">
                                    <input type="text" class="form-control form-control-sm" name="claimant"
                                           placeholder="认领人" required style="min-width:80px">
                                    <input type="text" class="form-control form-control-sm" name="claimContact"
                                           placeholder="联系方式" style="min-width:90px">
                                    <button type="submit" class="btn btn-sm btn-success">认领</button>
                                </form>
                                <span th:unless="${f.status.name() == 'OPEN'}" class="text-muted-sm">已完成</span>
                            </td>
                        </tr>
                        <tr th:if="${items.isEmpty()}">
                            <td colspan="7">
                                <div class="empty-state">
                                    <i class="bi bi-search-heart"></i>暂无失物记录
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
